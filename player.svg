<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Aikyn Sagyntai — now playing">
  <style>
    :root {
      --bg: #f4f4f5; --card: #ffffff; --line: #e4e4e7;
      --text: #18181b; --muted: #71717a; --accent: #3f3f46;
      --disc: #18181b; --groove: #2c2c31; --shine: rgba(255,255,255,0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b; --card: #18181b; --line: #27272a;
        --text: #f4f4f5; --muted: #a1a1aa; --accent: #d4d4d8;
        --disc: #0c0c0e; --groove: #222226; --shine: rgba(255,255,255,0.07);
      }
    }
    text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); stroke: var(--line); }
    .text { fill: var(--text); }
    .muted { fill: var(--muted); }
    .accent { fill: var(--accent); }
    .track { fill: var(--line); }

    .disc { transform-box: view-box; transform-origin: 160px 160px; animation: spin 4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .arm { transform-box: view-box; transform-origin: 298px 52px; animation: arm 30s ease-in-out infinite; }
    @keyframes arm { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }

    .progress { transform-box: fill-box; transform-origin: left center; animation: progress 30s linear infinite; }
    @keyframes progress { from { transform: scaleX(0.05); } to { transform: scaleX(1); } }
    .knob { animation: knob 30s linear infinite; }
    @keyframes knob { from { transform: translateX(50px); } to { transform: translateX(525px); } }

    .dot { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    .bar { fill: var(--accent); transform-box: fill-box; transform-origin: center bottom; animation: eq 1s ease-in-out infinite alternate; }
    @keyframes eq { from { transform: scaleY(0.15); } to { transform: scaleY(1); } }
  </style>

  <rect class="bg" width="900" height="320" rx="16"/>
  <rect class="card" x="12" y="12" width="876" height="296" rx="14"/>

  <!-- vinyl -->
  <g class="disc">
    <circle cx="160" cy="160" r="122" fill="var(--disc)"/>
    <g fill="none" stroke="var(--groove)" stroke-width="1.2">
      <circle cx="160" cy="160" r="112"/><circle cx="160" cy="160" r="104"/>
      <circle cx="160" cy="160" r="96"/><circle cx="160" cy="160" r="88"/>
      <circle cx="160" cy="160" r="80"/><circle cx="160" cy="160" r="72"/>
      <circle cx="160" cy="160" r="64"/><circle cx="160" cy="160" r="56"/>
    </g>
    <path d="M160 46 A114 114 0 0 1 266 120 L160 160 Z" fill="var(--shine)"/>
    <circle cx="160" cy="160" r="42" fill="#d4d4d8"/>
    <circle cx="160" cy="160" r="42" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="2"/>
    <text x="160" y="150" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="2" fill="#18181b">MATHALAMA</text>
    <text x="160" y="180" text-anchor="middle" font-size="8" letter-spacing="1.5" fill="#18181b" fill-opacity="0.7">SIDE A · 33⅓</text>
    <circle cx="160" cy="160" r="5" fill="var(--card)"/>
  </g>

  <!-- tonearm -->
  <g class="arm">
    <circle cx="298" cy="52" r="13" fill="var(--line)"/>
    <circle cx="298" cy="52" r="5" class="muted"/>
    <path d="M298 52 L286 150 L246 196" fill="none" stroke="var(--muted)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="232" y="188" width="22" height="14" rx="3" transform="rotate(-40 243 195)" fill="#e4e4e7" stroke="#71717a" stroke-width="1.5"/>
  </g>

  <!-- now playing -->
  <circle class="muted dot" cx="356" cy="58" r="5"/>
  <text class="muted" x="370" y="63" font-size="13" font-weight="700" letter-spacing="3">NOW PLAYING</text>
  <text class="muted" x="860" y="63" font-size="13" text-anchor="end">mathalama.dev</text>

  <text class="text" x="350" y="118" font-size="36" font-weight="700">Love Me Not</text>
  <text class="muted" x="350" y="150" font-size="18">Ravyn Lenae</text>

  <!-- progress -->
  <rect class="track" x="350" y="190" width="500" height="5" rx="2.5"/>
  <rect class="accent progress" x="350" y="190" width="500" height="5" rx="2.5"/>
  <g class="knob"><circle class="text" cx="325" cy="192.5" r="7"/></g>
  <text class="muted" x="350" y="218" font-size="12" style="font-variant-numeric: tabular-nums">1:24</text>
  <text class="muted" x="850" y="218" font-size="12" text-anchor="end" style="font-variant-numeric: tabular-nums">3:33</text>

  <!-- controls -->
  <g class="text">
    <path d="M360 248 L360 272 M384 248 L366 260 L384 272 Z" stroke="var(--text)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="420" cy="260" r="20" class="accent"/>
    <rect x="412" y="250" width="5" height="20" rx="1.5" fill="var(--card)"/>
    <rect x="423" y="250" width="5" height="20" rx="1.5" fill="var(--card)"/>
    <path d="M480 248 L480 272 M456 248 L474 260 L456 272 Z" stroke="var(--text)" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- equalizer -->
  <g>
    <rect class="bar" x="700" y="242" width="7" height="32" rx="2" style="animation-delay:-0.10s; animation-duration:0.9s"/>
    <rect class="bar" x="711" y="242" width="7" height="32" rx="2" style="animation-delay:-0.55s; animation-duration:0.7s"/>
    <rect class="bar" x="722" y="242" width="7" height="32" rx="2" style="animation-delay:-0.30s; animation-duration:1.1s"/>
    <rect class="bar" x="733" y="242" width="7" height="32" rx="2" style="animation-delay:-0.80s; animation-duration:0.8s"/>
    <rect class="bar" x="744" y="242" width="7" height="32" rx="2" style="animation-delay:-0.20s; animation-duration:1.0s"/>
    <rect class="bar" x="755" y="242" width="7" height="32" rx="2" style="animation-delay:-0.65s; animation-duration:0.75s"/>
    <rect class="bar" x="766" y="242" width="7" height="32" rx="2" style="animation-delay:-0.45s; animation-duration:0.95s"/>
    <rect class="bar" x="777" y="242" width="7" height="32" rx="2" style="animation-delay:-0.05s; animation-duration:0.85s"/>
    <rect class="bar" x="788" y="242" width="7" height="32" rx="2" style="animation-delay:-0.70s; animation-duration:1.05s"/>
    <rect class="bar" x="799" y="242" width="7" height="32" rx="2" style="animation-delay:-0.35s; animation-duration:0.7s"/>
    <rect class="bar" x="810" y="242" width="7" height="32" rx="2" style="animation-delay:-0.90s; animation-duration:0.9s"/>
    <rect class="bar" x="821" y="242" width="7" height="32" rx="2" style="animation-delay:-0.15s; animation-duration:1.15s"/>
    <rect class="bar" x="832" y="242" width="7" height="32" rx="2" style="animation-delay:-0.60s; animation-duration:0.8s"/>
    <rect class="bar" x="843" y="242" width="7" height="32" rx="2" style="animation-delay:-0.25s; animation-duration:0.95s"/>
  </g>
</svg>
